<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Serim : Créer une campagne</title>
    <link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}">
</head>

<body>
    <h2 class="page-title">Création de campagne</h2>
    <div class="container">
        <header>
            <div class="left-side">
                <a href="/dashboard" class="website-title">Serim</a>
            </div>
            <div class="right-side">
                <a href="#" class="red-btn" id="logoutBtn">Se déconnecter</a>
            </div>
        </header>
        <main>
            <div class="secondary-container">
                <form action="/create-campaign" method="post" enctype="multipart/form-data" id="campaignForm" class="campaign-form">
                    <label for="campaign-name" class="form-label">Titre de la campagne</label>
                    <input type="text" id="campaign-name" name="name" class="form-input"
                        placeholder="Entrez le titre de votre campagne" required>
                    <label for="campaign-image" class="form-label">Bannière d'illustration</label>
                    <input type="file" id="campaign-image" name="image" accept=".png, .jpg, .jpeg" class="form-input">
                    <label for="campaign-description" class="form-label">Description de la campagne</label>
                    <textarea rows="5" cols="50" id="campaign-description" name="description" class="form-textarea"
                        placeholder="Décrivez votre campagne en quelques mots"></textarea>
                    <button type="submit" class="red-btn">Créer la campagne</button>
                </form>

            </div>
        </main>
    </div>
    <footer>
        <p class="copyright">
            &copy; 2026 Projet alternatif CNAM : <em>Serim</em>. Tous droits
            réservés. Mathis MASSET - Pierre HERZOG - Lucila VANHALLE
        </p>
    </footer>

    <script src="{{ url_for('static', path='js/create-campaign.js') }}"></script>

</body>

</html>

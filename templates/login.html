<!doctype html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Serim : Connexion</title>
  <link rel="stylesheet" href="../static/css/style.css" />
</head>

<body>
  <h2 class="page-title">Connexion</h2>
  <div class="container">
    <header>
      <div class="left-side">
        <a href="index.html" class="website-title">Serim</a>
      </div>
      <div class="right-side">
        <a href="register.html" class="red-btn" id="register-btn">S'inscrire</a>
      </div>
    </header>
    <main>
      <div class="text-content">
        <h3>Nous sommes ravis de vous revoir !</h3>
        <form action="" method="post" class="login-form">
          <label for="email">Email :</label><br />
          <input type="email" id="email" name="email" placeholder="john@exemple.com" required />
          <br />
          <label for="password">Mot de passe :</label><br />
          <input type="password" id="password" name="password" placeholder="Votre mot de passe" required />
          <br />
          <a href="#" class="forgot-password">Mot de passe oublié ?</a><br />
          <button type="submit" class="red-btn">Se connecter</button>
        </form>
        <p class="signup-link">
          Pas encore inscrit.e ?
          <a href="register.html">S'inscrire maintenant</a>
        </p>
      </div>
    </main>
  </div>
  <footer>
    <p class="copyright">
      &copy; 2026 Projet alternatif CNAM : <em>Serim</em>. Tous droits
      réservés. Mathis MASSET - Pierre HERZOG - Lucila VANHALLE
    </p>
  </footer>
</body>

</html>

<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Serim - D&D Campaign Manager{% endblock %}</title>
    
    <!-- CSS statique -->
    <link rel="stylesheet" href="/static/css/style.css">
    
    {% block extra_css %}{% endblock %}
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="container">
            <div class="navbar-brand">
                <a href="/" class="logo">Serim</a>
            </div>
            <div class="navbar-menu">
                <a href="/" class="nav-link">Accueil</a>
                <a href="/dashboard" class="nav-link">Dashboard</a>
                <a href="/campaigns" class="nav-link">Campagnes</a>
                <a href="/characters" class="nav-link">Personnages</a>
            </div>
        </div>
    </nav>

    <!-- Contenu principal -->
    <main class="main-content">
        {% block content %}
        <!-- Le contenu spécifique de chaque page -->
        {% endblock %}
    </main>

    <!-- Pied de page -->
    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 Serim - D&D Campaign Manager. Tous droits réservés.</p>
        </div>
    </footer>

    <!-- JS statique -->
    <script src="/static/js/dashboard-menu.js"></script>
    
    {% block extra_js %}{% endblock %}
</body>
</html>

<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Serim : Créer un personnage</title>
    <link rel="stylesheet" href="../static/css/style.css">
</head>

<body>
    <h2 class="page-title">Création de personnage</h2>

    <!-- La barre de progression des étapes -->
    <div class="progress-container">
        <div class="progress">
            <ol class="steps">
                <li class="active-step">Classe</li>
                <li class="inactive-step">Race</li>
                <li class="inactive-step">Background</li>
                <li class="inactive-step">Compétences</li>
                <li class="inactive-step">Equipement</li>
            </ol>
        </div>
    </div>
    <div class="container">
        <header>
            <div class="left-side">
                <a href="dashboard-menu.html" class="website-title">Serim</a>
            </div>
            <div class="right-side">
                <a href="#" class="red-btn">Se déconnecter</a>
            </div>
        </header>
        <main>
            <form class="builder-grid" id="character-form">
                <!-- Zone gauche pour la sélection des choix -->
                <section class="selection-area">
                    <h3 id="step-title">Choisissez votre classe</h3>
                    <!-- Div où les données apparaîtront dynamiquement -->
                    <div id="dynamic-grid">
                </section>

                <!-- Zone de la fiche récapitulative -->
                <aside class="recap-section">
                    <h3 class="recap-title">Récapitulatif</h3>
                    <!-- Elements qui restent sur l'interface -->
                    <div class="identity">
                        <div class="avatar-container">
                            <img src="../static/images/placeholder.jpg" alt="avatar">
                        </div>
                        <div class="identity-fields">
                            <div class="name-container"><label for="characterName" class="character-name-label">Nom du
                                    personnage :</label>
                                <input type="text" name="character-name" id="characterName"
                                    placeholder="Nom du personnage" class="character-input" required>
                                <div class="file-container">
                                    <label for="avatar">Avatar :</label>
                                    <input type="file" name="avatar" id="avatar" placeholder="Choisir un fichier"
                                        class="file-input">
                                    <label for="level">Niveau :</label>
                                    <input type="number" name="level" id="level" placeholder="Niveau 1"
                                        class="level-input">
                                </div>
                            </div>
                        </div>
                    </div>
                    <!-- Elements qui vont apparaître en temps réel -->
                    <div class="choices">
                        <div class="class-choice"></div>
                        <div class="race-choice"></div>
                        <div class="bg-choice"></div>
                        <div class="skills-choice"></div>
                        <div class="items-choice"></div>
                    </div>
                    <input type="submit" value="Valider le personnage" class="confirm-character-btn">
                </aside>
            </form>
        </main>
    </div>
    <footer>
        <p class="copyright">
            &copy; 2026 Projet alternatif CNAM : <em>Serim</em>. Tous droits
            réservés. Mathis MASSET - Pierre HERZOG - Lucila VANHALLE
        </p>
    </footer>
</body>

</html>

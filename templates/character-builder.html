<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Serim : Créer un personnage</title>
    <link rel="stylesheet" href="../static/css/style.css">
</head>

<body>
    <h2 class="page-title">Création de personnage</h2>
    <nav class="progression-steps">
        <ol class="steps">
            <li>Classe</li>
            <li>Race</li>
            <li>Background</li>
            <li>Compétences</li>
            <li>Equipement</li>
        </ol>
    </nav>
    <div class="container">
        <header>
            <div class="left-side">
                <a href="dashboard-menu.html" class="website-title">Serim</a>
            </div>
            <div class="right-side">
                <a href="#" class="red-btn">Se déconnecter</a>
            </div>
        </header>
        <main class="builder-grid">
            <section class="selection-area">
                <h3>Choisissez votre classe</h3>
                <div class="class-grid">
                    <div class="class-card">
                        <div class="class-img"><img src="../static/images/placeholder.jpg" alt="juste un placeholder">
                        </div>
                        <div class="class-name">Barbare</div>
                    </div>
                    <div class="class-card">
                        <div class="class-img"><img src="../static/images/placeholder.jpg" alt="juste un placeholder">
                        </div>
                        <div class="class-name">Barde</div>
                    </div>
                </div>
            </section>
            <aside class="recap-section">
                <h3>Récapitulatif</h3>
            </aside>
        </main>
    </div>
    <footer>
        <p class="copyright">
            &copy; 2026 Projet alternatif CNAM : <em>Serim</em>. Tous droits
            réservés. Mathis MASSET - Pierre HERZOG - Lucila VANHALLE
        </p>
    </footer>
</body>

</html>

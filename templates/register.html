<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Serim : Inscription</title>
    <link rel="stylesheet" href="../static/css/style.css" />
  </head>
  <body>
    <h2 class="page-title">Inscription</h2>
    <div class="container">
      <header>
        <div class="left-side">
          <h1 class="website-title">Serim</h1>
        </div>
        <div class="right-side">
          <a href="login.html" class="red-btn" id="login-btn">Se connecter</a>
        </div>
      </header>
      <main>
        <div class="text-content">
          <h3>Créer un compte</h3>
          <h4>
            Créez votre compte pour accéder à vos campagnes et vos fiches de
            personnage.
          </h4>
          <form action="" method="post" class="register-form">
            <label for="username">Nom d'utilisateur :</label>
            <input
              type="text"
              id="username"
              name="username"
              placeholder="JohnDoe91"
              required
            />
            <label for="email">Email :</label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="john@exemple.com"
              required
            />
            <label for="password">Mot de passe :</label>
            <input
              type="password"
              id="password"
              name="password"
              placeholder="Entrez votre mot de passe"
              required
            />
            <label for="password">Confirmation du mot de passe :</label>
            <input
              type="password"
              id="password-confirm"
              name="password-confirm"
              placeholder="Confirmez votre mot de passe"
              required
            />
            <button type="submit" class="red-btn">S'inscrire</button>
          </form>
          <p class="login-link">
            Déjà inscrit.e ?
            <a href="login.html">Se connecter maintenant</a>
          </p>
        </div>
      </main>
    </div>
    <footer>
      <p class="copyright">
        &copy; 2026 Projet alternatif CNAM : <em>Serim</em>. Tous droits
        réservés. Mathis MASSET - Pierre HERZOG - Lucila VANHALLE
      </p>
    </footer>
  </body>
</html>

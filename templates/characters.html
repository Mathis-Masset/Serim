<!doctype html>
<html lang="fr">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Serim : Mes fiches de personnages</title>
    <link rel="stylesheet" href="../static/css/style.css" />
</head>

<body>
    <h2 class="page-title">Mes fiches de personnages</h2>
    <div class="container">
        <header>
            <div class="left-side">
                <a href="dashboard-menu.html" class="website-title">Serim</a>
            </div>
            <div class="right-side">
                <a href="#" class="red-btn">Se déconnecter</a>
            </div>
        </header>
        <main class="single-col-grid">
            <div class="secondary-container">
                <a href="character-builder.html" class="red-btn" id="create-btn">Créer un nouveau personnage</a>
                <div class="search-container">
                    <label for="searchBar" class="searchLabel">Rechercher un personnage : </label>
                    <input type="search" class="search-input" id="searchBar" placeholder="Rechercher un personnage...">
                </div>
                <div class="filter-container">
                    <label for="filterSelect">Trier par : </label>
                    <div class="menuSelect">
                        <select id="filterSelect">
                            <option value="defaut">Ordre d'ajout</option>
                            <option value="AZ">Nom de A à Z</option>
                            <option value="ZA">Nom de Z à A</option>
                            <option value="level-increase">Niveau (croissant)</option>
                            <option value="level-decrease">Niveau (décroissant)</option>
                        </select>
                    </div>
                </div>
                <div class="cards-container" id="characters-grid"></div>
            </div>
        </main>
    </div>
    <footer>
        <p class="copyright">
            &copy; 2026 Projet alternatif CNAM : <em>Serim</em>. Tous droits
            réservés. Mathis MASSET - Pierre HERZOG - Lucila VANHALLE
        </p>
    </footer>

    <script src="../static/js/characters.js"></script>
</body>

</html>

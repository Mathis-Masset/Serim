<!doctype html>
<html lang="fr">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Serim : réinitialisation du mot de passe</title>
    <link rel="stylesheet" href="../static/css/style.css" />
</head>

<body>
    <h2 class="page-title">Réinitialisation du mot de passe</h2>
    <div class="container">
        <header>
            <div class="left-side">
                <a href="index.html" class="website-title">Serim</a>
            </div>
            <div class="right-side">
                <a href="login.html" class="red-btn" id="login-btn">Se connecter</a>
            </div>
        </header>
        <main class="single-col-grid">
            <div class="text-content full-width">
                <h3>Choisissez votre nouveau mot de passe</h3>
                <form method="post" class="reset-form" id="resetForm">
                    <label for="password">Mot de passe :</label>
                    <input type="password" id="password" name="password" placeholder="Entrez votre mot de passe"
                        required />
                    <label for="password-confirm">Confirmation du mot de passe :</label>
                    <input type="password" id="confirmPassword" name="password-confirm"
                        placeholder="Confirmez votre mot de passe" required />
                    <button type="submit" class="red-btn">Changer mon mot de passe</button>
                </form>
            </div>
        </main>
    </div>
    <footer>
        <p class="copyright">
            &copy; 2026 Projet alternatif CNAM : <em>Serim</em>. Tous droits
            réservés. Mathis MASSET - Pierre HERZOG - Lucila VANHALLE
        </p>
    </footer>
    <script src="../static/js/reset-password.js"></script>
</body>

</html>
